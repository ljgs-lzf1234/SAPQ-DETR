task: detection

evaluator:
  type: CocoEvaluator
  iou_types: ['bbox', ]

# VisDrone-DET has 10 foreground categories.
num_classes: 10
remap_mscoco_category: False


train_dataloader: 
  type: DataLoader
  dataset: 
    type: CocoDetection
    img_folder: /root/autodl-tmp/data/vsidrone/COCO_full/train/images
    ann_file: /root/autodl-tmp/data/vsidrone/COCO_full/train/annotations/V0_train.json
    return_masks: False
    transforms:
      type: Compose
      ops: ~
  shuffle: True
  num_workers: 4
  drop_last: True 
  collate_fn:
    type: BatchImageCollateFuncion


val_dataloader:
  type: DataLoader
  dataset: 
    type: CocoDetection
    img_folder: /root/autodl-tmp/data/vsidrone/COCO_full/val/images
    ann_file: /root/autodl-tmp/data/vsidrone/COCO_full/val/annotations/V0_val.json
    return_masks: False
    transforms:
      type: Compose
      ops: ~ 
  shuffle: False
  num_workers: 4
  drop_last: False
  collate_fn:
    type: BatchImageCollateFuncion